name: Supplier stock (Thread Project, Cloke)
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: thread-stock
  cancel-in-progress: false
jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      # 20 Nov 2026 (his call): go easy on suppliers' servers. cron-job.org still starts this every 15 minutes (GitHub's own
      # schedule skips runs, and it starts it as a manual run), but it only reads the suppliers once an hour, in the first
      # quarter of the hour
      - id: gate
        run: |
          m=$(date -u +%M); if [ "$m" -lt 15 ]; then echo "go=1" >> $GITHUB_OUTPUT; else echo "not this quarter hour, skipped"; fi
      - if: steps.gate.outputs.go == '1'
        run: pip install --quiet paramiko openpyxl
      - if: steps.gate.outputs.go == '1'
        run: python3 .github/scripts/thread_stock.py
        env:
          TP_PASS: ${{ secrets.TP_SFTP_PASS }}
          TP_HOST: ${{ secrets.TP_SFTP_HOST }}
          TP_USER: ${{ secrets.TP_SFTP_USER }}
          CLOKE_USER: ${{ secrets.CLOKE_USER }}
          CLOKE_PASS: ${{ secrets.CLOKE_PASS }}
          CLOKE_KEY: ${{ secrets.CLOKE_KEY }}
          GH_TOKEN: ${{ github.token }}
