name: Supplier stock (Thread Project, Cloke)
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: thread-stock
  cancel-in-progress: false
jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - run: pip install --quiet paramiko openpyxl
      - run: python3 .github/scripts/thread_stock.py
        env:
          TP_PASS: ${{ secrets.TP_SFTP_PASS }}
          TP_HOST: ${{ secrets.TP_SFTP_HOST }}
          TP_USER: ${{ secrets.TP_SFTP_USER }}
          CLOKE_USER: ${{ secrets.CLOKE_USER }}
          CLOKE_PASS: ${{ secrets.CLOKE_PASS }}
          CLOKE_KEY: ${{ secrets.CLOKE_KEY }}
          GH_TOKEN: ${{ github.token }}
